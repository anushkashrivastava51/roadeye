name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install

      - name: Build web assets
        run: npm run build:web

      - name: Create Android project
        run: npx cap add android

      - name: Add camera / location permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n\n    <application#' $M
          cat $M

      - name: App icons
        run: |
          for d in android/app/src/main/res/mipmap-*; do
            [ -f "$d/ic_launcher.png" ] && cp icon-512.png "$d/ic_launcher.png"
            [ -f "$d/ic_launcher_round.png" ] && cp icon-512.png "$d/ic_launcher_round.png"
            [ -f "$d/ic_launcher_foreground.png" ] && cp icon-512.png "$d/ic_launcher_foreground.png"
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher*.xml

      - name: Sync & build debug APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../RoadEye.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RoadEye-apk
          path: RoadEye.apk

      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest RoadEye.apk --title "RoadEye Android APK" --notes "Debug APK built from ${{ github.sha }}. Download RoadEye.apk and install on Android (allow 'Install unknown apps')."
